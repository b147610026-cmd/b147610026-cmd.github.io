backend:
  name: github
  repo: b147610026-cmd/b147610026-cmd.github.io
  branch: main

media_folder: "static/images"
public_folder: "/images"

collections:
  - name: "posts"
    label: "生活隨筆文章"
    folder: "content/posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "標題", name: "title", widget: "string" }
      - { label: "發布日期", name: "date", widget: "datetime" }
      - { label: "標籤", name: "tags", widget: "list", default: ["生活紀錄"] }
      - { label: "內文草稿", name: "body", widget: "markdown" }